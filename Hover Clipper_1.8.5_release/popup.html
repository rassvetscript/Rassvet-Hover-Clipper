<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rassvet Hover Clipper</title>
  <link rel="stylesheet" href="popup.css" />
  <!-- Noto Sans 다국어 서브셋 로드 (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<div id="main-content">
  <div class="header" id="header">
    <div class="header-row">
      <span class="header-label">Rassvet Hover Clipper</span>
    </div>
  </div>

<div class="setting-group">
  <div class="setting-row">
    <span class="setting-label" data-i18n="cleanUrlMode"></span>
    <label class="switch">
      <input type="checkbox" id="cleanUrlMode">
      <span class="slider"></span>
    </label>
    </div>
  <div class="description-text" data-i18n="cleanUrlDescription">
   </div>
</div>

<div class="setting-group">
  <div class="setting-row" id="settingShortcut" style="cursor:pointer;">
    <span class="setting-label" data-i18n="settingShortcut"></span>
    <img class="setting-arrow" src="icons/arrow-right(light).svg" alt="arrow" width="12" height="12">
  </div>
  <div class="description-text" data-i18n="settingShortcutDescription">
  </div>
</div>

<div class="setting-group">
  <div class="setting-row" id="contactsupport" style="cursor:pointer;">
    <span class="setting-label"data-i18n="contactSupport"></span>
    <img class="external-link-icon" src="icons/external-link(light)" alt="arrow" width="12" height="12">
  </div>
  <div class="description-text" data-i18n="contactSupportDescription">
  </div>
</div>

<div class="setting-group">
  <div class="setting-row" id="donatepage" style="cursor:pointer;">
    <span class="setting-label" data-i18n="donate"></span>
    <img class="external-link-icon" src="icons/external-link(light)" alt="arrow" width="12" height="12"></div>
  <div class="description-text" data-i18n="donateDescription"></div>
</div>

<div class="setting-group">
  <div class="setting-row" id="aboutinfo" data-target="about-detail" style="cursor:pointer;">
    <span class="setting-label" data-i18n="aboutinfo"></span>
    <img class="setting-arrow" src="icons/arrow-right(light).svg" alt="arrow" width="12" height="12"></div>
</div>
</div>

<!-- 세부 페이지 섹션 (기본 숨김) -->
<div id="about-detail" class="detail-page" style="display: none;">
  <div class="header" id="header">
    <div class="header-row">
      <div class="headerSide" id="back-to-main">
        <img class="headerArrow" src="headerarrow-left(light).svg" alt="arrow">
      </div>
      <span class="header-label" data-i18n="aboutinfo"></span>
    </div>
  </div>

    <div class="about-container">
  <div class="about-icon">
    <img src="icons/icon256.png" alt="Hover Clipper Icon" width="100" height="100">
  </div>
  <div class="about-title">Rassvet Hover Clipper</div>
  <div class="about-corp">© Rassvet Script 2025</div>
  <div class="about-text">
    <span class="setting-label" data-i18n="softwareVersion"></span>
    <span class="setting-label"> 1.8.5</span>
  </div>
</div>
<div class="setting-group">
  <div class="setting-row" id="officialWebsite" data-target="about-detail" style="cursor:pointer;">
    <span class="setting-label" data-i18n="officialWebsite"></span>
    <img class="external-link-icon" src="icons/external-link(light).svg" alt="arrow" width="12" height="12"></div>
</div>

</div>

  <script src="popup.js"></script>
</body>
</html>
